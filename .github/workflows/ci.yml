name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pytest ruff
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib nbconvert ipykernel
          pip install -e .
      - name: Smoke test demo notebook
        env:
          MPLBACKEND: Agg
          DEMO_STEPS: "50"
        run: |
          jupyter nbconvert --to notebook --execute --output-dir /tmp --ExecutePreprocessor.timeout=300 notebooks/demo.ipynb

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib mypy
          pip install -e .
      - name: Type check
        run: mypy src
