[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-from-scratch"
version = "0.1.0"
description = "Decoder-only transformer implemented from scratch in NumPy"
requires-python = ">=3.9"
dependencies = ["numpy>=1.25", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["notebooks/", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
strict = true
disallow_any_generics = false  # numpy: bare np.ndarray is idiomatic
warn_return_any = false  # numpy operations legitimately return Any
